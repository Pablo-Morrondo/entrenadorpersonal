<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d211b"><title>Entrenador Personal v0.7.3</title><style>body{margin:0;background:#07120f;color:#f5fbf7;font:16px -apple-system,BlinkMacSystemFont,system-ui;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:28px}.small{color:#9bb2a8;font-size:13px}</style></head><body><div class="box"><h2>Actualizando a v0.7.3…</h2><p class="small">Renovando los archivos de la app sin borrar tus datos.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}const r=await fetch('./index.html?build=073-'+Date.now(),{cache:'no-store'});const h=await r.text();document.open();document.write(h);document.close();setTimeout(()=>{try{history.replaceState(null,'','./?v=073')}catch{}},50)}catch(e){document.body.innerHTML='<div class="box"><h2>No se pudo actualizar</h2><p class="small">Cierra Safari y vuelve a intentarlo.</p></div>'}})();</script></body></html>
